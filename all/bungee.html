<body>
  <h1 class="visuallyhidden">Bungee Roulette Screensaver - After Dark in the Browser</h1>

  <!-- jumper is the original's Daredevil / Half Daredevil / Cow / Fish /
       Half Fish / Random, jumps its One / Few / Many / Droves / Whole Bunches /
       Hundreds (how many before the screen is wiped), and equipment its Safe /
       Reliable / Used / So - So / Purfikt - how likely the rope is to hold.
       These are the module's own defaults. -->

  <script src="ad.js?v=cb82f29-261030155154"></script>
